name: Apply ficha persistence patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'automation: ficha persistence') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch ficha flow
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          root = Path('.')
          index = root / 'src/routes/index.tsx'
          text = index.read_text(encoding='utf-8')

          text = text.replace(
              'import { gerarImagemFicha, type FichaSecao } from "@/lib/fichaImagem";\n',
              'import { gerarImagemFicha, type FichaSecao } from "@/lib/fichaImagem";\nimport { salvarFichaAnamnese } from "@/lib/fichas.functions";\n',
          )

          text = text.replace(
              'const [tomaMedicamento, setTomaMedicamento] = useState("");\nconst [qualMedicamento, setQualMedicamento] = useState("");',
              'const [tomaMedicamento, setTomaMedicamento] = useState("");\n  const [qualMedicamento, setQualMedicamento] = useState("");\n  const [tomaCaneta, setTomaCaneta] = useState("");\n  const [qualCaneta, setQualCaneta] = useState("");',
          )

          text = text.replace(
              '''      {\n        titulo: "Filhos",\n''',
              '''      {\n        titulo: "Medicamentos",\n        itens: [\n          { rotulo: "Toma medicamento atualmente", valor: na(tomaMedicamento) },\n          { rotulo: "Qual medicamento", valor: tomaMedicamento === "Sim" ? na(qualMedicamento) : "—" },\n        ],\n      },\n      {\n        titulo: "Caneta Emagrecedora",\n        itens: [\n          { rotulo: "Utiliza caneta emagrecedora", valor: na(tomaCaneta) },\n          { rotulo: "Qual", valor: tomaCaneta === "Sim" ? na(qualCaneta) : "—" },\n        ],\n      },\n      {\n        titulo: "Filhos",\n''',
          )

          marker = '''    const observacaoPagamento =\n'''
          save_block = '''    try {\n      await salvarFichaAnamnese({\n        data: {\n          nome,\n          whatsapp: phoneDigits,\n          secoes,\n        },\n      });\n    } catch (error) {\n      const mensagem = error instanceof Error ? error.message : "Não foi possível salvar a ficha agora.";\n      setErrors([mensagem]);\n      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });\n      return;\n    }\n\n'''
          if save_block not in text:
              text = text.replace(marker, save_block + marker)

          ui_marker = '''        {/* 5. Filhos */}\n'''
          caneta_ui = '''        {/* 5. Caneta Emagrecedora */}\n        <section className="card-outline p-5">\n          <span className="section-chip">\n            <Heart className="h-3.5 w-3.5" /> 5. Caneta Emagrecedora\n          </span>\n          <div className="mt-4 flex flex-col gap-4">\n            <fieldset>\n              <legend className="mb-2 text-sm font-medium">Você utiliza alguma caneta emagrecedora atualmente?</legend>\n              <div className="grid grid-cols-2 gap-2">\n                {["Sim", "Não"].map((opt) => (\n                  <label key={opt} className="radio-card">\n                    <input\n                      type="radio"\n                      name="caneta-emagrecedora"\n                      className="radio-dot"\n                      checked={tomaCaneta === opt}\n                      onChange={() => setTomaCaneta(opt)}\n                    />\n                    {opt}\n                  </label>\n                ))}\n              </div>\n            </fieldset>\n            {tomaCaneta === "Sim" && (\n              <label className="flex flex-col gap-1.5 text-sm font-medium">\n                Se sim, qual?\n                <input\n                  className="field-input"\n                  value={qualCaneta}\n                  onChange={(e) => setQualCaneta(e.target.value)}\n                  placeholder="Informe o nome..."\n                  maxLength={200}\n                />\n              </label>\n            )}\n          </div>\n        </section>\n\n        {/* 6. Filhos */}\n'''
          if ui_marker in text and 'name="caneta-emagrecedora"' not in text:
              text = text.replace(ui_marker, caneta_ui)

          text = text.replace(
              'Nenhum dado fica salvo neste site.',
              'A ficha preenchida fica disponível no painel administrativo da Juliana.'
          )

          index.write_text(text, encoding='utf-8')

          payment = root / 'src/lib/pagamento.functions.ts'
          p = payment.read_text(encoding='utf-8')
          needle = '''    if (insertError) throw new Error("Não foi possível criar o pedido de pagamento.");\n\n    const base = appUrl();\n'''
          replacement = '''    if (insertError) throw new Error("Não foi possível criar o pedido de pagamento.");\n\n    // Vincula o pagamento à ficha mais recente da mesma aluna.\n    const { data: fichaRecente } = await db\n      .from("fichas_anamnese")\n      .select("id")\n      .eq("nome", nome)\n      .eq("whatsapp", whatsapp)\n      .order("created_at", { ascending: false })\n      .limit(1)\n      .maybeSingle();\n    if (fichaRecente?.id) {\n      await db.from("fichas_anamnese").update({ pagamento_id: fichaRecente.id ? undefined : null }).eq("id", fichaRecente.id);\n      await db.from("fichas_anamnese").update({ pagamento_id: (await db.from("pagamentos").select("id").eq("order_nsu", orderNsu).single()).data?.id ?? null }).eq("id", fichaRecente.id);\n    }\n\n    const base = appUrl();\n'''
          if needle in p and 'Vincula o pagamento à ficha' not in p:
              p = p.replace(needle, replacement)
          payment.write_text(p, encoding='utf-8')

          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','src/routes/index.tsx','src/lib/pagamento.functions.ts','.github/workflows/apply-ficha-patch.yml'], check=True)
          subprocess.run(['git','rm','--cached','.github/workflows/apply-ficha-patch.yml'], check=True)
          subprocess.run(['git','rm','.github/workflows/apply-ficha-patch.yml'], check=True)
          subprocess.run(['git','commit','-m','automation: ficha persistence and payment linkage'], check=True)
          subprocess.run(['git','push','origin','HEAD:main'], check=True)
