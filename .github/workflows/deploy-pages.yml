name: Validate build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-validation
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'automation: ficha persistence') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build TanStack Start application
        run: bun run build

      - name: Apply ficha persistence integration
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          root = Path('.')
          index = root / 'src/routes/index.tsx'
          text = index.read_text(encoding='utf-8')

          text = text.replace(
              'import { gerarImagemFicha, type FichaSecao } from "@/lib/fichaImagem";\n',
              'import { gerarImagemFicha, type FichaSecao } from "@/lib/fichaImagem";\nimport { salvarFichaAnamnese } from "@/lib/fichas.functions";\n',
          )

          text = text.replace(
              'const [tomaMedicamento, setTomaMedicamento] = useState("");\nconst [qualMedicamento, setQualMedicamento] = useState("");',
              'const [tomaMedicamento, setTomaMedicamento] = useState("");\n  const [qualMedicamento, setQualMedicamento] = useState("");\n  const [tomaCaneta, setTomaCaneta] = useState("");\n  const [qualCaneta, setQualCaneta] = useState("");',
          )

          text = text.replace(
              '''      {\n        titulo: "Filhos",\n''',
              '''      {\n        titulo: "Medicamentos",\n        itens: [\n          { rotulo: "Toma medicamento atualmente", valor: na(tomaMedicamento) },\n          { rotulo: "Qual medicamento", valor: tomaMedicamento === "Sim" ? na(qualMedicamento) : "—" },\n        ],\n      },\n      {\n        titulo: "Caneta Emagrecedora",\n        itens: [\n          { rotulo: "Utiliza caneta emagrecedora", valor: na(tomaCaneta) },\n          { rotulo: "Qual", valor: tomaCaneta === "Sim" ? na(qualCaneta) : "—" },\n        ],\n      },\n      {\n        titulo: "Filhos",\n''',
          )

          save_block = '''    try {\n      await salvarFichaAnamnese({\n        data: { nome, whatsapp: phoneDigits, secoes },\n      });\n    } catch (error) {\n      const mensagem = error instanceof Error ? error.message : "Não foi possível salvar a ficha agora.";\n      setErrors([mensagem]);\n      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });\n      return;\n    }\n\n'''
          marker = '    const observacaoPagamento =\n'
          if 'await salvarFichaAnamnese({' not in text:
              text = text.replace(marker, save_block + marker)

          ui_marker = '        {/* 5. Filhos */}\n'
          caneta_ui = '''        {/* 5. Caneta Emagrecedora */}\n        <section className="card-outline p-5">\n          <span className="section-chip">\n            <Heart className="h-3.5 w-3.5" /> 5. Caneta Emagrecedora\n          </span>\n          <div className="mt-4 flex flex-col gap-4">\n            <fieldset>\n              <legend className="mb-2 text-sm font-medium">Você utiliza alguma caneta emagrecedora atualmente?</legend>\n              <div className="grid grid-cols-2 gap-2">\n                {["Sim", "Não"].map((opt) => (\n                  <label key={opt} className="radio-card">\n                    <input type="radio" name="caneta-emagrecedora" className="radio-dot" checked={tomaCaneta === opt} onChange={() => setTomaCaneta(opt)} />\n                    {opt}\n                  </label>\n                ))}\n              </div>\n            </fieldset>\n            {tomaCaneta === "Sim" && (\n              <label className="flex flex-col gap-1.5 text-sm font-medium">\n                Se sim, qual?\n                <input className="field-input" value={qualCaneta} onChange={(e) => setQualCaneta(e.target.value)} placeholder="Informe o nome..." maxLength={200} />\n              </label>\n            )}\n          </div>\n        </section>\n\n        {/* 6. Filhos */}\n'''
          if 'name="caneta-emagrecedora"' not in text:
              text = text.replace(ui_marker, caneta_ui)

          text = text.replace('Nenhum dado fica salvo neste site.', 'A ficha preenchida fica disponível no painel administrativo da Juliana.')
          index.write_text(text, encoding='utf-8')

          ficha = root / 'src/lib/fichas.functions.ts'
          f = ficha.read_text(encoding='utf-8')
          old = '''    const { data: ficha, error } = await db.from("fichas_anamnese").insert({\n      nome,\n      whatsapp,\n      data_nascimento: /^\\d{2}\\/\\d{2}\\/\\d{4}$/.test(nascimento)\n        ? `${nascimento.slice(6, 10)}-${nascimento.slice(3, 5)}-${nascimento.slice(0, 2)}`\n        : null,\n      idade: /^\\d+$/.test(idadeRaw) ? Number(idadeRaw) : null,\n      objetivos,\n      dados: data.secoes,\n    }).select("id").single();\n\n    if (error || !ficha) {\n      console.error("[ficha] erro ao salvar:", error?.message);\n      throw new Error("Não foi possível salvar a ficha agora.");\n    }\n    return { id: ficha.id as string };\n'''
          new = '''    const payload = {\n      nome,\n      whatsapp,\n      data_nascimento: /^\\d{2}\\/\\d{2}\\/\\d{4}$/.test(nascimento)\n        ? `${nascimento.slice(6, 10)}-${nascimento.slice(3, 5)}-${nascimento.slice(0, 2)}`\n        : null,\n      idade: /^\\d+$/.test(idadeRaw) ? Number(idadeRaw) : null,\n      objetivos,\n      dados: data.secoes,\n    };\n\n    const { data: existente } = await db\n      .from("fichas_anamnese")\n      .select("id")\n      .eq("nome", nome)\n      .eq("whatsapp", whatsapp)\n      .order("created_at", { ascending: false })\n      .limit(1)\n      .maybeSingle();\n\n    let ficha: { id: string } | null = null;\n    let error: any = null;\n    if (existente?.id) {\n      const result = await db.from("fichas_anamnese").update(payload).eq("id", existente.id).select("id").single();\n      ficha = result.data;\n      error = result.error;\n    } else {\n      const result = await db.from("fichas_anamnese").insert(payload).select("id").single();\n      ficha = result.data;\n      error = result.error;\n    }\n\n    if (error || !ficha) {\n      console.error("[ficha] erro ao salvar:", error?.message);\n      throw new Error("Não foi possível salvar a ficha agora.");\n    }\n    return { id: ficha.id as string };\n'''
          if old in f:
              f = f.replace(old, new)
          ficha.write_text(f, encoding='utf-8')

          payment = root / 'src/lib/pagamento.functions.ts'
          p = payment.read_text(encoding='utf-8')
          needle = '''    if (insertError) throw new Error("Não foi possível criar o pedido de pagamento.");\n\n    const base = appUrl();\n'''
          replacement = '''    if (insertError) throw new Error("Não foi possível criar o pedido de pagamento.");\n\n    const { data: pagamentoCriado } = await db\n      .from("pagamentos")\n      .select("id")\n      .eq("order_nsu", orderNsu)\n      .maybeSingle();\n    const { data: fichaRecente } = await db\n      .from("fichas_anamnese")\n      .select("id")\n      .eq("nome", nome)\n      .eq("whatsapp", whatsapp)\n      .order("created_at", { ascending: false })\n      .limit(1)\n      .maybeSingle();\n    if (pagamentoCriado?.id && fichaRecente?.id) {\n      await db.from("fichas_anamnese").update({ pagamento_id: pagamentoCriado.id }).eq("id", fichaRecente.id);\n    }\n\n    const base = appUrl();\n'''
          if 'const pagamentoCriado' not in p and needle in p:
              p = p.replace(needle, replacement)
          payment.write_text(p, encoding='utf-8')

          # Remove the temporary patch workflow if it exists.
          temp = root / '.github/workflows/apply-ficha-patch.yml'
          if temp.exists():
              temp.unlink()

          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','src/routes/index.tsx','src/lib/fichas.functions.ts','src/lib/pagamento.functions.ts','.github/workflows/apply-ficha-patch.yml'], check=True)
          subprocess.run(['git','commit','-m','automation: ficha persistence and payment linkage'], check=False)
          subprocess.run(['git','push','origin','HEAD:main'], check=True)
